<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบผู้ดูแลระบบ | คณะเทคโนโลยีสารสนเทศ มรภ.ร้อยเอ็ด</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%232563eb'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' fill='white' font-size='18' font-weight='bold'>IT</text></svg>">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans Thai', sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0f2041 40%, #162d5a 70%, #1a3a6b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    /* Animated background particles */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 20% 50%, rgba(37, 99, 235, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        radial-gradient(circle at 60% 80%, rgba(37, 99, 235, 0.05) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid pattern overlay */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(6, 182, 212, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(6, 182, 212, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    /* Login Card */
    .login-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 440px;
      width: 100%;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.3),
        0 8px 24px rgba(0, 0, 0, 0.2);
      position: relative;
      z-index: 1;
      animation: cardFadeIn 0.6s ease-out;
    }

    @keyframes cardFadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Header Section */
    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      color: #ffffff;
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
      position: relative;
    }

    .login-logo::after {
      content: '';
      position: absolute;
      inset: -3px;
      border-radius: 21px;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.3), rgba(6, 182, 212, 0.3));
      z-index: -1;
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
      line-height: 1.3;
    }

    .login-subtitle {
      font-size: 0.88rem;
      color: #64748b;
      font-weight: 400;
      line-height: 1.5;
    }

    /* Divider */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, #e2e8f0, transparent);
      margin-bottom: 28px;
    }

    /* Error Alert */
    .alert-error {
      background: #fef2f2;
      color: #991b1b;
      border: 1px solid #fca5a5;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 0.88rem;
      font-weight: 500;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 8px;
      animation: shakeError 0.4s ease-in-out;
    }

    .alert-error.show {
      display: flex;
    }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-6px); }
      40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); }
      80% { transform: translateX(4px); }
    }

    .alert-error-icon {
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    /* Form Groups */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      color: #334155;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.1rem;
      color: #94a3b8;
      pointer-events: none;
      transition: color 0.25s;
    }

    .form-group input {
      width: 100%;
      padding: 13px 16px 13px 44px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 0.95rem;
      font-family: inherit;
      color: #0f172a;
      background: #f8fafc;
      transition: all 0.25s ease;
      outline: none;
    }

    .form-group input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-group input:focus ~ .input-icon {
      color: #2563eb;
    }

    .form-group input::placeholder {
      color: #94a3b8;
      font-weight: 400;
    }

    /* Password toggle */
    .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 1.15rem;
      padding: 4px;
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .toggle-password:hover {
      color: #2563eb;
      background: rgba(37, 99, 235, 0.08);
    }

    /* Login Button */
    .btn-login {
      width: 100%;
      padding: 14px 24px;
      background: linear-gradient(135deg, #2563eb, #0891b2);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1rem;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.3);
      transition: all 0.3s ease;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-login::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(37, 99, 235, 0.4);
    }

    .btn-login:hover::before {
      opacity: 1;
    }

    .btn-login:active {
      transform: translateY(0);
    }

    .btn-login:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-login .btn-text {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    /* Spinner */
    .spinner {
      display: none;
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-top-color: #ffffff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-login.loading .btn-text {
      display: none;
    }

    .btn-login.loading .spinner {
      display: inline-block;
    }

    /* Footer note */
    .login-footer {
      margin-top: 28px;
      text-align: center;
    }

    .login-footer .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.88rem;
      transition: all 0.2s;
      padding: 6px 12px;
      border-radius: 8px;
    }

    .login-footer .back-link:hover {
      background: rgba(37, 99, 235, 0.06);
      color: #1d4ed8;
    }

    .login-footer .copyright {
      margin-top: 12px;
      font-size: 0.75rem;
      color: #94a3b8;
      line-height: 1.5;
    }

    /* Responsive */
    @media (max-width: 480px) {
      body {
        padding: 16px;
        align-items: flex-start;
        padding-top: 40px;
      }

      .login-card {
        padding: 32px 24px;
        border-radius: 16px;
      }

      .login-title {
        font-size: 1.3rem;
      }

      .login-logo {
        width: 60px;
        height: 60px;
        font-size: 1.5rem;
        border-radius: 14px;
      }
    }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- Header -->
    <div class="login-header">
      <div class="login-logo">🔐</div>
      <h1 class="login-title">เข้าสู่ระบบผู้ดูแลระบบ</h1>
      <p class="login-subtitle">คณะเทคโนโลยีสารสนเทศ มหาวิทยาลัยราชภัฏร้อยเอ็ด</p>
    </div>

    <div class="divider"></div>

    <!-- Error Alert -->
    <div id="loginAlert" class="alert-error">
      <span class="alert-error-icon">⚠️</span>
      <span id="alertMessage">ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง</span>
    </div>

    <!-- Login Form -->
    <form id="adminLoginForm" autocomplete="on">
      <div class="form-group">
        <label for="username">ชื่อผู้ใช้งาน (Username)</label>
        <div class="input-wrapper">
          <input
            type="text"
            id="username"
            name="username"
            placeholder="กรอกชื่อผู้ใช้งาน"
            required
            autocomplete="username"
            autofocus
          >
          <span class="input-icon">👤</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">รหัสผ่าน (Password)</label>
        <div class="input-wrapper">
          <input
            type="password"
            id="password"
            name="password"
            placeholder="กรอกรหัสผ่าน"
            required
            autocomplete="current-password"
          >
          <span class="input-icon">🔒</span>
          <button type="button" class="toggle-password" id="togglePassword" title="แสดง/ซ่อนรหัสผ่าน" aria-label="แสดงรหัสผ่าน">
            <span id="eyeIcon">👁️</span>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-login" id="loginBtn">
        <span class="btn-text">เข้าสู่ระบบ</span>
        <span class="spinner"></span>
      </button>
    </form>

    <!-- Footer -->
    <div class="login-footer">
      <a href="index.html" class="back-link">← กลับสู่หน้าหลัก</a>
      <div class="copyright">
        © 2569 คณะเทคโนโลยีสารสนเทศ มหาวิทยาลัยราชภัฏร้อยเอ็ด
      </div>
    </div>
  </div>

  <script>
    // ==========================================
    // Check existing session — redirect if already logged in
    // ==========================================
    (async function checkExistingSession() {
      try {
        const res = await fetch('/api/auth/me');
        if (res.ok) {
          const data = await res.json();
          if (data.success) {
            window.location.replace('/admin/dashboard');
          }
        }
      } catch (e) {}
    })();

    // ==========================================
    // Toggle password visibility
    // ==========================================
    const togglePasswordBtn = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePasswordBtn.addEventListener('click', function () {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.textContent = isPassword ? '🙈' : '👁️';
      this.setAttribute('aria-label', isPassword ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน');
    });

    // ==========================================
    // Login Form Submission
    // ==========================================
    const loginForm = document.getElementById('adminLoginForm');
    const loginAlert = document.getElementById('loginAlert');
    const alertMessage = document.getElementById('alertMessage');
    const loginBtn = document.getElementById('loginBtn');
    const usernameInput = document.getElementById('username');

    loginForm.addEventListener('submit', async function (e) {
      e.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      // Hide previous error
      loginAlert.classList.remove('show');

      if (!username || !password) {
        showError('กรุณากรอกชื่อผู้ใช้และรหัสผ่าน');
        return;
      }

      // Show loading state
      loginBtn.disabled = true;
      loginBtn.classList.add('loading');

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });

        const data = await res.json();

        if (!res.ok || !data.success) {
          throw new Error(data.error || 'ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');
        }

        // Login success — redirect to dashboard
        // Use replace to prevent back-button returning to login
        window.location.replace('/admin/dashboard');

      } catch (err) {
        showError(err.message);
        // Clear only password field
        passwordInput.value = '';
        passwordInput.focus();
      } finally {
        loginBtn.disabled = false;
        loginBtn.classList.remove('loading');
      }
    });

    function showError(message) {
      alertMessage.textContent = message;
      loginAlert.classList.remove('show');
      // Force reflow to re-trigger animation
      void loginAlert.offsetWidth;
      loginAlert.classList.add('show');
    }
  </script>
</body>
</html>
